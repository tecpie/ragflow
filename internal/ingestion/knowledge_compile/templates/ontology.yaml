kind: ontology
display_name: Ontology — Induce TBox from structure compilation
description: >-
  Config-only operator. ontology_id, or ontology_name when id is empty, selects
  the ontology whose classes and relations the sibling knowledge-graph operator
  uses to extract instances. An ontology selected by id is not rewritten from
  the extracted graph. Does not call an LLM by itself.
config:
  kind: ontology
  ontology_name: Compiled Ontology
  ontology_base_iri: http://ragflow.local/ontology#
  ontology_id: ''
