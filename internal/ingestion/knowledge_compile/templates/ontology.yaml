kind: ontology
display_name: Ontology — Extract ABox from modeled TBox
description: >-
  Extracts concept and relation instances from documents according to the
  ontology selected by ontology_id (preferred) or ontology_name. Uses the
  workbench modeling document when stored, including concept/relation
  properties; otherwise falls back to Turtle class and relation labels.
  Does not rewrite a modeled ontology from extracted types.
config:
  kind: ontology
  ontology_name: Compiled Ontology
  ontology_base_iri: http://ragflow.local/ontology#
  ontology_id: ''
